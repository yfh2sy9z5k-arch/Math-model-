<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f7f4ed'><title>Model Math Lab</title><style>
:root{--ink:#17212b;--muted:#66717c;--paper:#f7f4ed;--card:#fff;--accent:#356a5b;--line:#d7d1c5;--warn:#9a5d32}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink)}header{padding:22px 18px 12px;max-width:850px;margin:auto}h1{margin:0;font-size:26px}.sub{color:var(--muted);margin-top:4px}.wrap{max-width:850px;margin:auto;padding:8px 16px 80px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{background:#e9e4da;padding:6px 10px;border-radius:999px;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #0000000a}.q{font-size:20px;line-height:1.45}.model{min-height:190px;background:#fbfaf7;border:2px dashed var(--line);border-radius:14px;padding:16px;overflow:auto}.row{display:flex;align-items:center;gap:8px;margin:13px 0;min-width:520px}.who{width:72px;font-weight:700}.bar{height:48px;border:2px solid var(--ink);display:flex;background:#f0eadf;position:relative;min-width:60px}.unit{min-width:65px;flex:1;border-right:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;padding:2px}.unit:last-child{border-right:0}.unknown{background:#fff}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:700;background:var(--accent);color:#fff;font-size:15px}button.secondary{background:#e7e2d8;color:var(--ink)}button.danger{background:#805544}input,select{width:100%;padding:12px;border:1px solid #cfc8bb;border-radius:10px;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feedback{padding:12px;border-radius:12px;background:#eef3ef;margin-top:12px;display:none}.feedback.bad{background:#f6ece6}.progress{height:8px;background:#ded8cd;border-radius:8px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--accent)}small{color:var(--muted)}@media(max-width:600px){.grid{grid-template-columns:1fr}.q{font-size:18px}.card{padding:15px}.model{padding:10px}.row{min-width:430px}.who{width:62px}.unit{min-width:54px}}
</style></head><body><header><h1>Model Math Lab</h1><div class='sub'>See it. Model it. Solve it.</div></header><main class='wrap'><div class='top'><span class='pill' id='level'></span><span class='pill' id='type'></span><span class='pill' id='count'></span></div><div class='progress'><div id='prog'></div></div>
<section class='card'><div class='q' id='question'></div><div class='controls'><button class='secondary' id='hintBtn'>Hint</button><button class='secondary' id='showBtn'>Show target model</button></div><div class='feedback' id='hint'></div></section>
<section class='card'><b>1. Build the model</b><p><small>Add rows and split each bar into equal units. Tap labels to edit them.</small></p><div class='model' id='model'></div><div class='controls'><button id='addRow'>+ Add bar</button><button class='secondary' id='split'>Split selected bar</button><button class='secondary' id='label'>Label selected unit</button><button class='danger' id='clear'>Clear</button></div><div class='feedback' id='target'></div></section>
<section class='card'><b>2. Write the equation and solve</b><div class='grid' style='margin-top:12px'><div><small>Equation</small><input id='equation' placeholder='e.g. 4 × 24 = 96'></div><div><small>Final answer</small><input id='answer' inputmode='decimal' placeholder='Enter number'></div></div><div class='controls'><button id='check'>Check my work</button><button class='secondary' id='next'>Next question</button></div><div class='feedback' id='feedback'></div></section></main><script>
const qs=[
['P3','Part–whole','Mia has 28 red beads and 17 blue beads. How many beads does she have altogether?',45,'Draw two known parts that combine to make one whole.','28 + 17 = 45','Red:28|Blue:17 → Whole:?'],
['P3','Part–whole','There are 63 books on a shelf. 25 are storybooks. The rest are information books. How many information books are there?',38,'The whole is known. One part is known. Find the missing part.','63 - 25 = 38','Whole:63 → Story:25|Information:?'],
['P3','Comparison','Aisha has 36 stickers. Ben has 14 more stickers than Aisha. How many stickers does Ben have?',50,'Make Ben’s bar the same length as Aisha’s, then add an extra part of 14.','36 + 14 = 50','Aisha:36\nBen:36|14'],
['P3','Comparison','Kai has 52 cards. Leo has 19 fewer cards than Kai. How many cards does Leo have?',33,'Show Kai’s longer bar. The extra part is 19.','52 - 19 = 33','Kai:?|19 = 52\nLeo:?'],
['P3','Equal groups','There are 6 bags with 8 oranges in each bag. How many oranges are there altogether?',48,'Split one bar into 6 equal units. Each unit represents 8.','6 × 8 = 48','8|8|8|8|8|8'],
['P3','Equal groups','42 cupcakes are packed equally into 6 boxes. How many cupcakes are in each box?',7,'Split the whole into 6 equal units.','42 ÷ 6 = 7','?|?|?|?|?|? = 42'],
['P3','Part–whole','Noah saved $35 in June and $27 in July. How much did he save in both months?',62,'Represent June and July as two parts of one total.','35 + 27 = 62','June:35|July:27'],
['P3','Comparison','Lina read 47 pages. Sam read 12 more pages than Lina. How many pages did Sam read?',59,'Sam has Lina’s amount plus an extra 12.','47 + 12 = 59','Lina:47\nSam:47|12'],
['P3','Equal groups','5 trays hold 9 cups each. How many cups are there?',45,'Use 5 equal units, each labelled 9.','5 × 9 = 45','9|9|9|9|9'],
['P3','Part–whole','A tank held 80 L of water. 34 L was used. How much water remained?',46,'Start with the whole 80 L and separate the used and remaining parts.','80 - 34 = 46','Used:34|Left:? = 80'],
['P4','Multiplicative comparison','Ben has 24 marbles. Ali has 3 times as many marbles as Ben. How many marbles does Ali have?',72,'Ben is 1 unit. Ali is 3 equal units.','3 × 24 = 72','Ben:24\nAli:24|24|24'],
['P4','Multiplicative comparison','Sara has 18 stamps. Mei has 4 times as many stamps as Sara. How many stamps do they have altogether?',90,'Sara is 1 unit and Mei is 4 units. Altogether there are 5 units.','5 × 18 = 90','Sara:18\nMei:18|18|18|18'],
['P4','Multiplicative comparison','Tom has 5 times as many cards as Jay. Tom has 60 cards. How many cards does Jay have?',12,'Tom’s 60 is represented by 5 equal units. Find 1 unit.','60 ÷ 5 = 12','Jay:?\nTom:?|?|?|?|? = 60'],
['P4','Equal groups','96 pencils are placed equally into 8 packets. How many pencils are in 3 packets?',36,'First find 1 unit, then find 3 units.','96 ÷ 8 = 12; 12 × 3 = 36','8 units = 96; find 3 units'],
['P4','Comparison','Ravi has $84. He has $29 more than Chen. How much money does Chen have?',55,'Ravi’s bar is Chen’s bar plus an extra $29.','84 - 29 = 55','Chen:?\nRavi:?|29 = 84'],
['P4','Part–whole','A library had 125 visitors in the morning and 89 in the afternoon. How many visitors came that day?',214,'Join the two parts to form the daily total.','125 + 89 = 214','Morning:125|Afternoon:89'],
['P4','Multiplicative comparison','A rope is 6 times as long as a ribbon. The ribbon is 15 cm long. What is their total length?',105,'Ribbon = 1 unit; rope = 6 units; total = 7 units.','7 × 15 = 105','Ribbon:15\nRope:15×6'],
['P4','Equal groups','7 identical notebooks cost $56. How much do 4 notebooks cost?',32,'Find the cost of 1 notebook before finding 4.','56 ÷ 7 = 8; 8 × 4 = 32','7 units = 56; find 4 units'],
['P4','Comparison','Eva has 68 shells. She has 23 fewer shells than Ian. How many shells does Ian have?',91,'Ian’s bar must be longer than Eva’s by 23.','68 + 23 = 91','Eva:68\nIan:68|23'],
['P4','Multiplicative comparison','There are 4 times as many blue balloons as red balloons. There are 20 blue balloons. How many balloons are there altogether?',25,'Blue = 4 units = 20. Red = 1 unit. Total = 5 units.','20 ÷ 4 = 5; 20 + 5 = 25','Red:?\nBlue:?|?|?|? = 20']];
let i=0,selected=null; const $=x=>document.getElementById(x);function render(){let q=qs[i];$('level').textContent=q[0];$('type').textContent=q[1];$('count').textContent=`${i+1} / ${qs.length}`;$('prog').style.width=((i+1)/qs.length*100)+'%';$('question').textContent=q[2];$('hint').style.display='none';$('target').style.display='none';$('feedback').style.display='none';$('equation').value='';$('answer').value='';$('model').innerHTML='';selected=null}function row(){let r=document.createElement('div');r.className='row';let who=document.createElement('div');who.className='who';who.textContent='Bar';who.onclick=()=>{let n=prompt('Name this bar:',who.textContent);if(n)who.textContent=n};let b=document.createElement('div');b.className='bar';b.style.width='220px';let u=document.createElement('div');u.className='unit unknown';u.textContent='?';b.appendChild(u);b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.bar').forEach(x=>x.style.outline='');b.style.outline='3px solid #8ba99f';selected=b};r.append(who,b);$('model').appendChild(r);selected=b} $('addRow').onclick=row;$('split').onclick=()=>{if(!selected)return alert('Tap a bar first.');let n=Number(prompt('How many equal units?',2));if(n<2||n>10)return;selected.innerHTML='';for(let k=0;k<n;k++){let u=document.createElement('div');u.className='unit unknown';u.textContent='?';selected.appendChild(u)}};$('label').onclick=()=>{if(!selected)return alert('Tap a bar first.');let units=[...selected.children];let n=Number(prompt(`Which unit? 1-${units.length}`,1))-1;if(!units[n])return;let v=prompt('Label:',units[n].textContent);if(v!==null)units[n].textContent=v};$('clear').onclick=()=>{$('model').innerHTML='';selected=null};$('hintBtn').onclick=()=>{let f=$('hint');f.textContent=qs[i][4];f.style.display='block';f.className='feedback'};$('showBtn').onclick=()=>{let f=$('target');f.innerHTML='<b>Target relationship</b><br>'+qs[i][6].replaceAll('\n','<br>');f.style.display='block';f.className='feedback'};$('check').onclick=()=>{let a=parseFloat($('answer').value),q=qs[i],f=$('feedback');f.style.display='block';if(a===q[3]){f.className='feedback';f.innerHTML=`<b>Correct.</b> ${q[5]}<br><small>Now compare your bars with the target relationship. The important idea is that the bar lengths and equal units show the quantities correctly.</small>`}else{f.className='feedback bad';f.innerHTML=`<b>Not yet.</b> Recheck the relationship in your model. Hint: ${q[4]}`}};$('next').onclick=()=>{i=(i+1)%qs.length;render()};render();
</script></body></html>
